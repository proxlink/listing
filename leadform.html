<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hubungi Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
      background:
        linear-gradient(rgba(15,25,45,.30), rgba(15,25,45,.30)),
        url("https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    .form-container {
      width: 100%;
      max-width: 820px;
      background: rgba(255,255,255,.96);
      border-radius: 30px;
      padding: 45px 55px;
      box-shadow: 0 25px 80px rgba(0,0,0,.25);
      backdrop-filter: blur(10px);
    }

    .form-header { text-align: center; margin-bottom: 35px; }

    .property-icon {
      width: 80px; height: 80px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: #fff;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      color: #c8941d;
    }

    .property-icon svg { width: 42px; height: 42px; }

    .form-header h1 {
      font-size: 38px;
      line-height: 1.2;
      color: #18243a;
      font-weight: 700;
    }

    .form-header h1 span { display: block; color: #c8941d; }

    .form-header p {
      margin-top: 16px;
      font-size: 17px;
      line-height: 1.7;
      color: #667085;
    }

    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
    }

    .divider::before, .divider::after {
      content: "";
      width: 35px;
      height: 1px;
      background: #c8941d;
    }

    .diamond {
      width: 10px;
      height: 10px;
      background: #c8941d;
      transform: rotate(45deg);
    }

    .form-group { margin-bottom: 20px; }

    label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 9px;
      font-size: 16px;
      font-weight: 600;
      color: #26354d;
    }

    label svg { width: 24px; height: 24px; color: #b98717; }
    .required { color: #d92d20; }

    input, select {
      width: 100%;
      height: 62px;
      border: 1px solid #d0d5dd;
      border-radius: 13px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 16px;
      color: #18243a;
      background: #fff;
      outline: none;
      transition: all .25s ease;
    }

    input::placeholder { color: #98a2b3; }

    input:focus, select:focus {
      border-color: #c8941d;
      box-shadow: 0 0 0 4px rgba(200,148,29,.12);
    }

    select { cursor: pointer; }

    .whatsapp-btn {
      width: 100%;
      min-height: 68px;
      margin-top: 10px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      font-family: inherit;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
      background: linear-gradient(135deg,#d8a11c,#b87a00);
      box-shadow: 0 10px 25px rgba(184,122,0,.25);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(184,122,0,.35);
    }

    .whatsapp-btn:active { transform: scale(.98); }
    .whatsapp-btn svg { width: 30px; height: 30px; }

    .privacy {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 10px;
      margin-top: 28px;
      text-align: center;
      color: #667085;
      font-size: 14px;
      line-height: 1.7;
    }

    .privacy svg {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
      color: #c8941d;
      margin-top: 2px;
    }

    @media (max-width: 600px) {
      body { padding: 15px 10px; background-attachment: scroll; }
      .form-container { padding: 32px 22px; border-radius: 24px; }
      .property-icon { width: 68px; height: 68px; }
      .property-icon svg { width: 36px; height: 36px; }
      .form-header h1 { font-size: 30px; }
      .form-header p { font-size: 14px; }
      label { font-size: 14px; }
      input, select { height: 58px; font-size: 15px; }
      .whatsapp-btn { font-size: 17px; min-height: 62px; }
      .privacy { font-size: 12px; }
    }
  </style>
</head>

<body>
  <div class="form-container">
    <div class="form-header">
      <div class="property-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 10.5 12 3l9 7.5M5.25 9v10.5h13.5V9M9 19.5v-6h6v6"/>
        </svg>
      </div>

      <h1>Berminat Dengan <span>Rumah Ini?</span></h1>
      <p>Lengkapkan maklumat di bawah dan<br>agent akan membantu anda.</p>

      <div class="divider"><div class="diamond"></div></div>
    </div>

    <form id="leadForm">
      <div class="form-group">
        <label>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.118a7.5 7.5 0 0 1 15 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.5-1.632Z"/>
          </svg>
          Nama Penuh <span class="required">*</span>
        </label>
        <input type="text" id="name" placeholder="Contoh: Ahmad Bin Ali" required>
      </div>

      <div class="form-group">
        <label>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106a1.125 1.125 0 0 0-1.173.417l-.97 1.293a1.062 1.062 0 0 1-1.21.38 12.035 12.035 0 0 1-7.143-7.143 1.062 1.062 0 0 1 .38-1.21l1.293-.97c.34-.255.5-.694.417-1.173L7.05 3.102A1.125 1.125 0 0 0 5.959 2.25H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"/>
          </svg>
          No. WhatsApp <span class="required">*</span>
        </label>
        <input type="tel" id="phone" placeholder="Contoh: 0123456789" required>
      </div>

      <div class="form-group">
        <label>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25H4.5a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5H4.5a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-.832 1.756l-7.5 6.168a2.25 2.25 0 0 1-2.856 0l-7.5-6.168a2.25 2.25 0 0 1-.832-1.756V6.75"/>
          </svg>
          Email <span class="required">*</span>
        </label>
        <input type="email" id="email" placeholder="Contoh: anda@email.com" required>
      </div>

      <div class="form-group">
        <label>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
          </svg>
          Tujuan Membeli <span class="required">*</span>
        </label>
        <select id="purpose" required>
          <option value="" selected disabled>Pilih tujuan membeli</option>
          <option value="Beli Rumah Pertama">Beli Rumah Pertama</option>
          <option value="Duduk Sendiri">Duduk Sendiri</option>
          <option value="Pelaburan">Pelaburan</option>
          <option value="Upgrade Rumah">Upgrade Rumah</option>
          <option value="Masih Survey">Masih Survey</option>
        </select>
      </div>

      <div class="form-group">
        <label>
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 0 0 9-9c0-5.25-9-9-9-9s-9 3.75-9 9a9 9 0 0 0 9 9Z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 12.75a2.25 2.25 0 1 0 0-4.5 2.25 2.25 0 0 0 0 4.5Z"/>
          </svg>
          Kawasan Diminati <span class="required">*</span>
        </label>
        <select id="location" required>
          <option value="" selected disabled>Pilih kawasan</option>
          <option value="Melaka">Melaka</option>
          <option value="Negeri Sembilan">Negeri Sembilan</option>
          <option value="Selangor">Selangor</option>
          <option value="Kuala Lumpur">Kuala Lumpur</option>
        </select>
      </div>

      <button type="submit" class="whatsapp-btn">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 11.812c0 4.39-3.858 7.938-8.625 7.938a9.24 9.24 0 0 1-4.035-.924L3.75 20.25l1.02-3.39a7.495 7.495 0 0 1-1.77-4.798c0-4.39 3.858-7.938 8.625-7.938s8.625 3.548 8.625 7.938Z"/>
        </svg>
        CHAT WHATSAPP
      </button>

      <div class="privacy">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 2.25c-2.132 1.59-4.72 2.43-7.5 2.43v5.814c0 4.318 2.987 8.222 7.5 9.756 4.513-1.534 7.5-5.438 7.5-9.756V4.68c-2.78 0-5.368-.84-7.5-2.43Z"/>
        </svg>
        <span>Maklumat anda selamat & tidak akan dikongsi dengan pihak ketiga.</span>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("leadForm").addEventListener("submit", function(event) {
      event.preventDefault();

      // TUKAR NOMBOR WHATSAPP AGENT DI SINI
      // Contoh format Malaysia: 60123456789
      const WHATSAPP_NUMBER = "60123456789";

      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const purpose = document.getElementById("purpose").value;
      const location = document.getElementById("location").value;

      const message = `Hi, saya ${name}.

Saya berminat untuk mendapatkan maklumat mengenai hartanah.

📱 No. WhatsApp: ${phone}
📧 Email: ${email}

🎯 Tujuan Membeli:
${purpose}

📍 Kawasan Diminati:
${location}

Boleh saya dapatkan maklumat lanjut?`;

      const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);

      window.location.href = whatsappURL;
    });
  </script>
</body>
</html>
