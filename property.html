<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>CariHouse.my | Property</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--ink:#151515;--soft:#f7f6f2;--line:#e8e6df;--gold:#b28a43;--muted:#777}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--soft);color:var(--ink)}
button{font:inherit}
.property-page{max-width:900px;margin:25px auto 45px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 5px 20px rgba(0,0,0,.045)}
.gallery{background:#111}.mainimg{width:100%;height:500px;object-fit:contain;display:block;cursor:zoom-in;touch-action:pan-y}
.thumbs{display:flex;gap:8px;overflow:auto;padding:10px}.thumb{width:78px;height:60px;object-fit:cover;border-radius:8px;opacity:.6;cursor:pointer;border:2px solid transparent}.thumb.selected{opacity:1;border-color:#fff}
.detail{padding:23px}.detailtag{display:inline-block;background:#f0ece2;color:#795b27;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}
.detail h2{font-size:30px;line-height:1.1;margin:11px 0 5px}.muted{color:var(--muted);font-size:13px}.detailprice{font-size:27px;font-weight:950;margin:14px 0 0}.detailmonthly-label{font-size:13px;font-weight:800;margin-top:9px}.detailmonthly{font-size:16px;font-weight:800;white-space:nowrap;margin-top:4px}
.detailgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.spec{background:#f6f5f1;border-radius:13px;padding:13px;text-align:center}.spec b{display:block;font-size:16px}.spec span{display:block;color:#777;font-size:10px;margin-top:3px}
.desc{white-space:pre-line;line-height:1.65;color:#444;font-size:14px}.wa{display:block;text-align:center;text-decoration:none;background:#25D366;color:#fff;padding:15px;border-radius:12px;font-weight:900;margin-top:20px}
.share{display:block;width:100%;text-align:center;border:1px solid #111;background:#111;color:#fff;text-decoration:none;padding:13px;border-radius:12px;font-weight:800;margin-top:9px;cursor:pointer}
.loading,.empty{max-width:900px;margin:60px auto;padding:30px;text-align:center;color:#777}.empty{color:#b91c1c}
.fullscreen-view{position:fixed;inset:0;background:#000;z-index:100;display:none;align-items:center;justify-content:center;touch-action:none}.fullscreen-view.open{display:flex}.fullscreen-img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}.fullscreen-close{position:absolute;right:16px;top:16px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:28px;line-height:44px;padding:0;z-index:2;cursor:pointer}
@media(max-width:600px){.property-page{margin:0;border-radius:0;min-height:100dvh}.mainimg{height:320px}.detail h2{font-size:25px}.detailgrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="propertyRoot" class="loading">Memuatkan listing...</div>
<div id="fullscreenView" class="fullscreen-view"><button class="fullscreen-close" onclick="closeFullscreen(event)" aria-label="Tutup">×</button><img id="fullscreenImg" class="fullscreen-img" src="" alt=""></div>
<script>
const SUPABASE_URL="https://axaunfzdyqgqxtunlntw.supabase.co";
const SUPABASE_KEY="sb_publishable_fb-Fg80ze_LeA9onM19BUQ_XZAZOp-k";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let property=null,currentGallery=[],currentGalleryIndex=0,swipeStartX=0;
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function money(v){return v==null||v===""?"Harga atas permintaan":"RM "+Number(v).toLocaleString("en-MY")}
function imgs(x){return Array.isArray(x.images)?x.images:[]}
async function trackEvent(eventType,propertyId=null){try{await sb.from("analytics_events").insert([{event_type:eventType,property_id:propertyId!=null?String(propertyId):null}]);}catch(err){console.warn("Analytics:",err?.message||err)}}
async function loadProperty(){
 const id=new URLSearchParams(location.search).get("id");
 if(!id){$("propertyRoot").className="empty";$("propertyRoot").textContent="Listing tidak dijumpai.";return}
 const {data,error}=await sb.from("properties").select("*").eq("id",id).maybeSingle();
 if(error||!data){$("propertyRoot").className="empty";$("propertyRoot").textContent="Listing tidak dijumpai.";return}
 property=data;currentGallery=imgs(property);currentGalleryIndex=0;
 document.title=`${property.title||"Property"} | CariHouse.my`;
 trackEvent("property_view",property.id);
 renderProperty();
}
function renderProperty(){
 const x=property,im=currentGallery,first=im[0]||"";
 $("propertyRoot").className="property-page";
 $("propertyRoot").innerHTML=`<div class="gallery">
 ${first?`<img id="mainimg" class="mainimg" src="${esc(first)}" alt="${esc(x.title)}">`:`<div class="mainimg" style="display:grid;place-items:center;color:white;font-size:70px">🏠</div>`}
 ${im.length>1?`<div class="thumbs">${im.map((u,i)=>`<img class="thumb ${i?"":"selected"}" src="${esc(u)}" onclick="changeImgIndex(${i})" alt="${esc(x.title)}">`).join("")}</div>`:""}</div>
 <div class="detail"><span class="detailtag">${esc(x.listing_type)} · ${esc(x.status||"Available")}</span>
 <h2>${esc(x.title)}</h2><div class="muted">📍 ${esc(x.location||"-")}</div><div class="detailprice">${money(x.price)}</div>${x.monthly_payment!=null&&x.monthly_payment!==""?`<div class="detailmonthly-label">Anggaran Bulanan</div><div class="detailmonthly">RM ${Number(x.monthly_payment).toLocaleString("en-MY")}/bulan</div>`:""}
 <div class="detailgrid">${x.bedrooms!=null?`<div class="spec"><b>🛏 ${esc(x.bedrooms)}</b><span>Bilik Tidur</span></div>`:""}${x.bathrooms!=null?`<div class="spec"><b>🚿 ${esc(x.bathrooms)}</b><span>Bilik Air</span></div>`:""}${x.built_up?`<div class="spec"><b>${esc(x.built_up)}</b><span>Built-up</span></div>`:""}${x.land_area?`<div class="spec"><b>${esc(x.land_area)}</b><span>Land Area</span></div>`:""}</div>
 ${x.description?`<h3>Property Details</h3><div class="desc">${esc(x.description)}</div>`:""}
 ${x.whatsapp&&x.status!=="Sold"?`<a class="wa" target="_blank" rel="noopener" onclick="trackEvent('whatsapp_click','${esc(x.id)}')" href="https://wa.me/${"6"+String(x.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent("Hi, saya berminat dengan property: "+x.title+(x.location?" - "+x.location:""))}">💬 WhatsApp Agent</a>`:""}
 <button class="share" type="button" onclick="shareListing('${esc(x.title)}')">↗ Share Property</button></div>`;
 const main=$("mainimg");if(main){main.onclick=()=>openFullscreen(currentGalleryIndex);main.ontouchstart=e=>{swipeStartX=e.changedTouches[0].clientX};main.ontouchend=e=>handleSwipe(e.changedTouches[0].clientX)}
}
window.changeImgIndex=i=>{if(!currentGallery[i])return;currentGalleryIndex=i;const m=$("mainimg");if(m)m.src=currentGallery[i];document.querySelectorAll(".thumb").forEach((x,n)=>x.classList.toggle("selected",n===i));};
window.handleSwipe=endX=>{const dx=endX-swipeStartX;if(Math.abs(dx)<50)return;if(dx<0&&currentGalleryIndex<currentGallery.length-1)changeImgIndex(currentGalleryIndex+1);if(dx>0&&currentGalleryIndex>0)changeImgIndex(currentGalleryIndex-1);};
window.openFullscreen=i=>{if(!currentGallery[i])return;currentGalleryIndex=i;$("fullscreenImg").src=currentGallery[i];$("fullscreenView").classList.add("open");};
window.closeFullscreen=e=>{if(e)e.stopPropagation();$("fullscreenView").classList.remove("open");};
function syncFullscreen(){const img=$("fullscreenImg");if(img)img.src=currentGallery[currentGalleryIndex]||"";}
$("fullscreenView").addEventListener("touchstart",e=>{swipeStartX=e.changedTouches[0].clientX});
$("fullscreenView").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-swipeStartX;if(Math.abs(dx)>=50){if(dx<0&&currentGalleryIndex<currentGallery.length-1)currentGalleryIndex++;else if(dx>0&&currentGalleryIndex>0)currentGalleryIndex--;syncFullscreen();}});
$("fullscreenView").addEventListener("click",e=>{if(e.target===$("fullscreenView"))closeFullscreen(e)});
window.shareListing=async title=>{try{if(!property)return;trackEvent("share_property",property.id);const url=location.href;if(navigator.share)await navigator.share({title,text:"Property: "+title,url});else{await navigator.clipboard.writeText(url);alert("Link property disalin.")}}catch(_){}};
loadProperty();
</script>
</body>
</html>
